          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"

          [[mods]]
          modId="holycross"
          version="1.0.0"
          displayName="Holy Cross (Крест Света)"
          description='''
          Adds the Cross of Light: right-click to repel nearby mobs with a wave of light.
          Undead are pushed back harder and weakened. No damage, pure crowd control.
          '''

          [[dependencies.holycross]]
              modId="forge"
              mandatory=true
              versionRange="[47,)"
              ordering="NONE"
              side="BOTH"

          [[dependencies.holycross]]
              modId="minecraft"
              mandatory=true
              versionRange="[1.20.1,1.21)"
              ordering="NONE"
              side="BOTH"
